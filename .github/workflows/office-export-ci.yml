name: Koral Office Export CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Analyze, test and build Koral web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter 3.47
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          cache: true

      - name: Restore dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Generate web scaffold
        run: flutter create --platforms=web .

      - name: Build release web app
        run: flutter build web --release
