# Koral

Koral is a premium Flutter + Supabase creative studio platform for turning ideas into polished campaign output.

## Product vision

Koral helps teams turn raw concepts into usable creative systems: briefs, storyboards, campaign plans, export packs, and collaborative review flows. The app is designed for modern creative teams that need secure access, project visibility, and a polished workflow from concept to export.

## Included in this starter

- Auth gate and sign-in screen
- Project library and new-project flow
- Brief composer
- Storyboard/studio planning
- Export center
- Notifications
- Admin dashboard
- Team workspace
- Offline-cache service scaffold
- Supabase-ready initialization

## Run locally

1. Install Flutter 3.24 or newer.
2. In the project root, run:
   ```bash
   flutter pub get
   ```
3. Add your local environment values in `.env` or `--dart-define`.
4. Start the app:
   ```bash
   flutter run
   ```

## Supabase setup

The starter already includes `supabase_flutter` and a configuration layer. Add:

```bash
SUPABASE_URL=https://your-project.supabase.co
SUPABASE_ANON_KEY=your-anon-key
```

If Supabase isn’t configured yet, the app still boots in a demo mode for local UI development.

